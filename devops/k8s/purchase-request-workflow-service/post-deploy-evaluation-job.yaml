apiVersion: batch/v1
kind: Job
metadata:
  name: purchase-request-workflow-service-post-deploy-evaluation
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    devops.ssd/change-id: 06eab8f9cf4c
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: purchase-request-workflow-service
        app.kubernetes.io/component: post-deploy-evaluation
    spec:
      restartPolicy: Never
      containers:
      - name: trigger-observability
        image: curlimages/curl:8.7.1
        env:
        - name: SERVICE_NAME
          value: purchase-request-workflow-service
        - name: APP_NAMESPACE
          value: devops-ssd-assignment
        - name: APP_LABEL
          value: purchase-request-workflow-service
        - name: CHANGE_ID
          value: 06eab8f9cf4c
        - name: CURRENT_VERSION
          value: 06eab8f9cf4c
        - name: PREVIOUS_HEALTHY_VERSION
          value: unknown
        - name: ARGOCD_APP_NAME
          value: purchase-request-workflow-service
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: gha-post-deployment-trigger
              key: pat
        - name: HEALTH_ENDPOINT
          value: http://purchase-request-workflow-service.devops-ssd-assignment.svc.cluster.local/health
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: post-deployment-evaluation-env
              key: PROMETHEUS_URL
              optional: true
        - name: LOKI_URL
          valueFrom:
            configMapKeyRef:
              name: post-deployment-evaluation-env
              key: LOKI_URL
              optional: true
        - name: OBSERVABILITY_WORKFLOW_URL
          value: https://api.github.com/repos/Legiang98/devops-sdd-assignment/actions/workflows/observability-workflow.yml/dispatches
        - name: OBSERVABILITY_WORKFLOW_REF
          value: dev
        command:
        - /bin/sh
        - -ec
        args:
        - "test -n \"${GITHUB_TOKEN}\"\ncat > /tmp/dispatch.json <<EOF\n{\n  \"ref\"\
          : \"${OBSERVABILITY_WORKFLOW_REF}\",\n  \"inputs\": {\n    \"service_name\"\
          : \"${SERVICE_NAME}\",\n    \"namespace\": \"${APP_NAMESPACE}\",\n    \"\
          app_label\": \"${APP_LABEL}\",\n    \"change_id\": \"${CHANGE_ID}\",\n \
          \   \"current_version\": \"${CURRENT_VERSION}\",\n    \"previous_healthy_version\"\
          : \"${PREVIOUS_HEALTHY_VERSION}\",\n    \"update_healthy_state\": \"true\"\
          ,\n    \"argocd_app_name\": \"${ARGOCD_APP_NAME}\",\n    \"prometheus_url\"\
          : \"${PROMETHEUS_URL}\",\n    \"loki_url\": \"${LOKI_URL}\",\n    \"health_endpoint\"\
          : \"${HEALTH_ENDPOINT}\"\n  }\n}\nEOF\nhttp_code=$(curl -sS -o /tmp/dispatch-response.txt\
          \ -w \"%{http_code}\" \\\n  -X POST \\\n  -H \"Accept: application/vnd.github+json\"\
          \ \\\n  -H \"Authorization: Bearer ${GITHUB_TOKEN}\" \\\n  -H \"X-GitHub-Api-Version:\
          \ 2022-11-28\" \\\n  \"${OBSERVABILITY_WORKFLOW_URL}\" \\\n  --data @/tmp/dispatch.json)\n\
          if [ \"${http_code}\" != \"204\" ]; then\n  cat /tmp/dispatch-response.txt\n\
          \  echo \"GitHub workflow dispatch failed with status ${http_code}\"\n \
          \ exit 1\nfi\necho \"Triggered observability workflow for ${SERVICE_NAME}\
          \ (${CHANGE_ID}) on ref ${OBSERVABILITY_WORKFLOW_REF}\""
  backoffLimit: 1
