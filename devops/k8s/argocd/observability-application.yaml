apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-ssd-observability
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    path: devops/observability/minikube
    repoURL: git@github.com:Legiang98/devops-sdd-assignment.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
