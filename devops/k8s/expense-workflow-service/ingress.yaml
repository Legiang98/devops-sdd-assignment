apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-workflow-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    app: expense-workflow
spec:
  rules:
  - host: expense-workflow.local
    http:
      paths:
      - path: /expenses/(?<expense_id>[^/]+)/approve
        pathType: Prefix
        backend:
          service:
            name: expense-workflow-service
            port:
              number: 80