            "code": {
              "language": "markdown",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "# Workflow Trace Overview\n\nThis dashboard is Tempo-only and is designed for OTLP span work.\n\nTracked business spans in `expense-workflow`:\n- `workflow.submit_expense`\n- `workflow.load_rules`\n- `workflow.evaluate_required_stages`\n- `workflow.record_required_approvals`\n- `workflow.approve_expense`\n- `workflow.complete_approval_step`\n- `workflow.audit_event`\n\nUse the dashboard links above to jump directly into Tempo Explore.",
            "mode": "markdown"
          },
          "pluginVersion": "10.4.5",
          "title": "Overview",
          "type": "text"
        },
        {
          "datasource": {
            "type": "grafana",
            "uid": "-- Grafana --"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "code": {
              "language": "markdown",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "## Useful Span Attributes\n\nThe app now emits business attributes on spans:\n- `app.change_id`\n- `app.service`\n- `app.release_id`\n- `workflow.operation`\n- `workflow.required_stages`\n- `workflow.completed_stages`\n- `workflow.stage_count`\n- `approval.role`\n- `expense.id`\n- `expense.amount`\n- `expense.status`\n- `app.audit.event`\n\nThese are the main filters to use in TraceQL.",
            "mode": "markdown"
          },
          "pluginVersion": "10.4.5",
          "title": "Span Attributes",
          "type": "text"
        },
        {
          "datasource": {
            "type": "grafana",
            "uid": "-- Grafana --"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "code": {
              "language": "markdown",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "## TraceQL Queries\n\nAll traces for the service:\n```traceql\n{ resource.service.name = \"expense-workflow\" }\n```\n\nSubmit flow only:\n```traceql\n{ resource.service.name = \"expense-workflow\" && name = \"workflow.submit_expense\" }\n```\n\nApproval flow only:\n```traceql\n{ resource.service.name = \"expense-workflow\" && name = \"workflow.approve_expense\" }\n```\n\nApproval errors:\n```traceql\n{ resource.service.name = \"expense-workflow\" && status = error }\n```\n\nAudit spans only:\n```traceql\n{ resource.service.name = \"expense-workflow\" && name = \"workflow.audit_event\" }\n```",
            "mode": "markdown"
          },
          "pluginVersion": "10.4.5",
          "title": "Queries",
          "type": "text"
        },
        {
          "datasource": {
            "type": "grafana",
            "uid": "-- Grafana --"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "options": {
            "code": {
              "language": "markdown",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "## Filter Examples\n\nSearch by expense id:\n```traceql\n{ resource.service.name = \"expense-workflow\" && span.expense.id = \"<expense-id>\" }\n```\n\nSearch finance-stage approvals:\n```traceql\n{ resource.service.name = \"expense-workflow\" && span.workflow.required_stages = \"finance\" }\n```\n\nSearch by change id:\n```traceql\n{ resource.service.name = \"expense-workflow\" && span.app.change_id = \"EXPENSE-finance-approval\" }\n```\n\nSearch approved terminal state:\n```traceql\n{ resource.service.name = \"expense-workflow\" && span.expense.status = \"APPROVED\" }\n```",
            "mode": "markdown"
          },
          "pluginVersion": "10.4.5",
          "title": "Filters",
          "type": "text"
