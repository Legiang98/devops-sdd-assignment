schema_version: 1.0.0
change_id: PURCHASE-MANAGER-APPROVAL
service: purchase-request-workflow-service
summary: Add manager approval stage for purchase requests >= 1000
owner: procurement-ops
risk_tier: medium

intent:
  business_outcome: Require manager review for medium and high value purchase requests.
  non_goals:
    - No infrastructure migration
    - No schema change

workflow_change:
  new_stage:
    name: manager
    required_when:
      amount_gte: 1000

api_contract:
  endpoints:
    - method: POST
      path: /purchase-requests/{request_id}/approve

quality:
  unit_tests:
    required: true
    min_new_tests: 2
    focus_areas:
      - request_submission
      - approval_thresholds

observability_assertions:
  - metric: approval_step_required_total
    labels:
      step: manager
    expected_behavior: increment only for purchase requests >= 1000
  - metric: purchase_request_approved_total
    expected_behavior: increment when all required stages complete
