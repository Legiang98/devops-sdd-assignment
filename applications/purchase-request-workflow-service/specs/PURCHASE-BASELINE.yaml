schema_version: 1.0.0
change_id: PURCHASE-BASELINE
service: purchase-request-workflow-service
summary: Baseline purchase request workflow backend
owner: procurement-platform
risk_tier: low

workflow_change:
  baseline_stages:
    - name: requester
      required_when:
        amount_gte: 0

workspace:
  path: applications/purchase-request-workflow-service
  src_path: src
  tests_path: tests
  dockerfile_path: Dockerfile
  manifest_path: devops/k8s/purchase-request-workflow-service

api_contract:
  endpoints:
    - method: POST
      path: /purchase-requests
    - method: GET
      path: /purchase-requests/{request_id}

docs:
  swagger:
    path: /openapi.json

deployment:
  environment: local
  strategy: replace
  rollback_target: PURCHASE-BASELINE
  k8s:
    namespace: devops-ssd-assignment
    deployment:
      name: purchase-request-workflow-service
      replicas: 1
      container_port: 8000
    service:
      name: purchase-request-workflow-service
      port: 80
      target_port: 8000
    ingress:
      enabled: true

quality:
  unit_tests:
    required: true
    min_new_tests: 1
    focus_areas:
      - request_submission
