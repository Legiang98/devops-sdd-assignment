schema_version: 1.0.0
change_id: EXP-GET-EXPENSE-BY-ID
service: expense-workflow
summary: Add endpoint to fetch a submitted expense by ID
owner: finance-ops
risk_tier: low

intent:
  business_outcome: Let approvers and operators retrieve the current state of a single expense without re-submitting it.
  non_goals:
    - No infrastructure migration
    - No schema change
    - No workflow stage change

api_contract:
  endpoints:
    - method: GET
      path: /expenses/{expense_id}

quality:
  unit_tests:
    required: true
    min_new_tests: 1
    focus_areas:
      - expense_lookup
      - unknown_expense_handling

observability_assertions:
  - metric: expense_submitted_total
    expected_behavior: unchanged by expense lookup requests
