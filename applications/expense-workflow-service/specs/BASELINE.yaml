schema_version: 1.0.0
change_id: BASELINE
service: expense-workflow
summary: Baseline manager-only workflow
owner: platform
risk_tier: low

workflow_change:
  baseline_stages:
    - name: manager
      required_when:
        amount_gte: 0

api_contract:
  endpoints:
    - method: POST
      path: /expenses
    - method: POST
      path: /expenses/{expense_id}/approve

docs:
  swagger:
    path: /openapi.json

deployment:
  environment: local
  strategy: replace
  rollback_target: BASELINE
  k8s:
    namespace: devops-ssd-assignment
    deployment:
      name: expense-workflow
      replicas: 1
      container_port: 8000
    service:
      name: expense-workflow
      port: 80
      target_port: 8000
    ingress:
      enabled: false

quality:
  unit_tests:
    required: true
    min_new_tests: 1
    focus_areas:
      - expense_submission
