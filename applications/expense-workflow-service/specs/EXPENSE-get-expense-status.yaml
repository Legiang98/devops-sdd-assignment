schema_version: 1.0.0
change_id: EXP-GET-EXPENSE-STATUS
service: expense-workflow
summary: Add endpoint to fetch the current status of an expense
owner: finance-ops
risk_tier: low

intent:
  business_outcome: Let clients check the current workflow status of a submitted expense quickly.
  non_goals:
    - No infrastructure migration
    - No schema change
    - No workflow stage change

api_contract:
  endpoints:
    - method: GET
      path: /expenses/{expense_id}/status

quality:
  unit_tests:
    required: true
    min_new_tests: 1
    focus_areas:
      - expense_status_lookup
      - expense_status_not_found

observability_assertions:
  - metric: expense_submitted_total
    expected_behavior: unchanged by expense status lookup requests
