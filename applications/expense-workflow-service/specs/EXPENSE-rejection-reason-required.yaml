schema_version: 1.0.0
change_id: EXP-REJECTION-REASON-REQUIRED
service: expense-workflow
summary: Require rejection reason code and comment for expense rejection
owner: finance-ops
risk_tier: medium

intent:
  business_outcome: Ensure every rejection decision is auditable and explainable.
  non_goals:
    - No infrastructure migration
    - No schema change

workflow_change:
  baseline_stages:
    - name: manager
      required_when:
        amount_gte: 0
  new_stage:
    name: finance
    required_when:
      amount_gte: 1000

api_contract:
  endpoints:
    - method: POST
      path: /expenses
    - method: POST
      path: /expenses/{expense_id}/approve
    - method: POST
      path: /expenses/{expense_id}/reject

deployment:
  environment: local
  strategy: replace
  rollback_target: BASELINE
  k8s:
    namespace: devops-ssd-assignment
    deployment:
      name: expense-workflow
      replicas: 1
      container_port: 8000
    service:
      name: expense-workflow
      port: 80
      target_port: 8000
    ingress:
      enabled: false

quality:
  unit_tests:
    required: true
    min_new_tests: 2
    focus_areas:
      - rejection_validation
      - rejection_audit_fields

observability_assertions:
  - metric: expense_rejected_total
    expected_behavior: increment when rejection is accepted with required reason fields
  - metric: rejection_missing_reason_total
    expected_behavior: increment when reject request misses reason_code/comment
