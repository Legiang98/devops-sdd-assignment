schema_version: 1.0.0
change_id: EXP-REJECTION-REASON-REQUIRED
service: expense-workflow
summary: Require rejection reason code and comment for expense rejection
owner: finance-ops
risk_tier: medium

intent:
  business_outcome: Ensure every rejection decision is auditable and explainable.
  non_goals:
    - No infrastructure migration
    - No schema change

workflow_change:
  new_stage:
    name: finance
    required_when:
      amount_gte: 1000
  
api_contract:
  endpoints:
    - method: POST
      path: /expenses/{expense_id}/reject

quality:
  unit_tests:
    required: true
    min_new_tests: 2
    focus_areas:
      - rejection_validation
      - rejection_audit_fields

observability_assertions:
  - metric: expense_rejected_total
    expected_behavior: increment when rejection is accepted with required reason fields
  - metric: rejection_missing_reason_total
    expected_behavior: increment when reject request misses reason_code/comment
