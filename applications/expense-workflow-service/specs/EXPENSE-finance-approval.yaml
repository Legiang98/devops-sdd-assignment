schema_version: 1.0.0
change_id: EXP-FINANCE-APPROVAL
service: expense-workflow
summary: Add finance approval stage for expenses >= 1000
owner: finance-ops
risk_tier: medium

intent:
  business_outcome: Prevent high-value expenses from bypassing finance review.
  non_goals:
    - No infrastructure migration
    - No schema change

workflow_change:
  baseline_stages:
    - name: manager
      required_when:
        amount_gte: 0
  new_stage:
    name: finance
    required_when:
      amount_gte: 1000

api_contract:
  endpoints:
    - method: POST
      path: /expenses
    - method: POST
      path: /expenses/{expense_id}/approve
    - method: POST
      path: /expenses/{expense_id}/reject

docs:
  swagger:
    path: /openapi.json

deployment:
  environment: local
  strategy: replace
  rollback_target: BASELINE
  k8s:
    namespace: devops-ssd-assignment
    deployment:
      name: expense-workflow
      replicas: 1
      container_port: 8000
    service:
      name: expense-workflow
      port: 80
      target_port: 8000
    ingress:
      enabled: false

quality:
  unit_tests:
    required: true
    min_new_tests: 2
    focus_areas:
      - expense_submission
      - approval_thresholds

observability_assertions:
  - metric: approval_step_required_total
    labels:
      step: finance
    expected_behavior: increment only for expenses >= 1000
  - metric: expense_approved_total
    expected_behavior: increment when all required stages complete
