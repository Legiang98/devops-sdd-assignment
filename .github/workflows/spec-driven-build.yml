name: Spec Driven Build

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: "Spec file path"
        required: false
        default: "applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
  push:
    paths:
      - "applications/**/specs/*.yaml"
      - "devops/agent/**"
      - "devops/policy/**"
      - "devops/scripts/**"
      - "scripts/**"
      - ".github/workflows/spec-driven-build.yml"
  pull_request:
    paths:
      - "applications/**/specs/*.yaml"
      - "devops/agent/**"
      - "devops/policy/**"
      - "devops/scripts/**"
      - "scripts/**"
      - ".github/workflows/spec-driven-build.yml"

jobs:
  pipeline:
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
      pull-requests: write
    env:
      AGENT_CODEGEN_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Check Ollama endpoint
        if: env.AGENT_CODEGEN_PROVIDER == 'ollama'
        run: |
          curl -sf "${OLLAMA_BASE_URL}/api/tags" >/dev/null

      - name: Resolve spec and release id
        id: resolve
        run: |
          set -euo pipefail

          SPEC_FILE="${{ github.event.inputs.spec_file }}"
          if [ -z "${SPEC_FILE}" ]; then
            SPEC_FILE="applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
          fi

          RELEASE_ID=$(python3 -c "import yaml, pathlib; s=yaml.safe_load(pathlib.Path('${SPEC_FILE}').read_text(encoding='utf-8')); print(s['change_id'])")

          echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Run spec pipeline (generate + gate)
        run: |
          . .venv/bin/activate
          ./devops/scripts/trigger-pipeline.sh \
            "${{ steps.resolve.outputs.spec_file }}" \
            "${{ steps.resolve.outputs.release_id }}" \
            "${AGENT_CODEGEN_PROVIDER:-deterministic}" \
            "${OLLAMA_MODEL:-qwen2.5:7b}" \
            "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"

      - name: Build app (syntax/build smoke check)
        run: |
          . .venv/bin/activate
          python -m compileall applications/expense-workflow-service/src

      - name: Build image and update GitOps image tag
        id: image_meta
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="expense-workflow"
          IMAGE_TAG="${GITHUB_SHA::12}"

          if ! command -v minikube >/dev/null 2>&1; then
            echo "[build] minikube CLI not found on runner"
            exit 1
          fi

          if ! minikube status >/dev/null 2>&1; then
            echo "[build] minikube is not running"
            exit 1
          fi

          echo "[build] building image directly in minikube"
          minikube image build \
            -f applications/expense-workflow-service/Dockerfile \
            -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

          ./devops/scripts/update_image_tag.sh "${IMAGE_REPOSITORY}" "${IMAGE_TAG}"

          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect generated artifacts changes
        id: generated_changes
        run: |
          set -euo pipefail
          if git status --porcelain -- applications/expense-workflow-service/src/generated devops/k8s/deployment.yaml devops/k8s/image-tag.yaml | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit generated artifacts on dev
        if: github.event_name == 'push' && github.ref_name == 'dev' && steps.generated_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/expense-workflow-service/src/generated/
          git add devops/k8s/deployment.yaml devops/k8s/image-tag.yaml
          git commit -m "ci(spec): generate code for ${{ steps.resolve.outputs.release_id }} [skip ci]"
          git push origin HEAD:dev

      - name: Create PR with generated artifacts on main
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.generated_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci(spec): generate code for ${{ steps.resolve.outputs.release_id }} [skip ci]"
          title: "ci(spec): generated code for ${{ steps.resolve.outputs.release_id }}"
          body: |
            Auto-generated code update from spec-driven pipeline.

            - Release ID: `${{ steps.resolve.outputs.release_id }}`
            - Spec: `${{ steps.resolve.outputs.spec_file }}`
            - Source: `${{ github.workflow }} #${{ github.run_number }}`
          branch: "bot/spec-generate-${{ github.run_id }}"
          base: main
          add-paths: |
            applications/expense-workflow-service/src/generated/**
            devops/k8s/deployment.yaml
            devops/k8s/image-tag.yaml

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-driven-evidence-${{ github.run_id }}
          path: |
            logs/pipeline.log
            build/releases/${{ steps.resolve.outputs.release_id }}/evidence/
            applications/expense-workflow-service/src/generated/spec_contract.py
