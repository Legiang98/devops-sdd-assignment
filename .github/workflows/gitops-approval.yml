name: GitOps Approval Listener

on:
  issue_comment:
    types: [created]

jobs:
  approve_gitops:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'gitops-approval') &&
      contains(github.event.comment.body, '/approve')
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}
          fetch-depth: 0
          set-safe-directory: false

      - name: Extract Branch Info
        id: info
        run: |
          BODY="${{ github.event.issue.body }}"
          PROP_BRANCH=$(echo "$BODY" | grep -o "proposal/[^\\\` ]*" | head -n 1)
          TARGET_BRANCH=$(echo "$BODY" | grep -o "Target Branch: \\\`[^\\\`]*\\\`" | sed 's/Target Branch: \\\`//;s/\\\`//' | head -n 1)
          
          echo "prop_branch=$PROP_BRANCH" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          
          if [ -z "$PROP_BRANCH" ] || [ -z "$TARGET_BRANCH" ]; then
            echo "❌ Could not extract branch info from issue body."
            exit 1
          fi
          echo "✅ Proposal: $PROP_BRANCH -> Target: $TARGET_BRANCH"

      - name: Merge and Push
        env:
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          set -euo pipefail
          PROP_BRANCH="${{ steps.info.outputs.prop_branch }}"
          TARGET_BRANCH="${{ steps.info.outputs.target_branch }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "Merging $PROP_BRANCH into $TARGET_BRANCH..."
          git fetch origin "$PROP_BRANCH"
          git checkout "$TARGET_BRANCH"
          git merge "origin/$PROP_BRANCH" -m "ci(gitops): merge approved manifest update [skip ci]"
          
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin "$TARGET_BRANCH"

      - name: Close Approval Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ Approval received! Changes have been merged into `${{ steps.info.outputs.target_branch }}`. Closing issue."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
            
            // Optional: Delete the proposal branch
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/${{ steps.info.outputs.prop_branch }}"
              });
            } catch (e) {
              console.log("Could not delete branch: " + e.message);
            }
