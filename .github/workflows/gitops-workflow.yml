name: GitOps Pipeline

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: "Spec file path"
        required: false
        default: "applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
  push:
    branches:
      - dev
      - feat/gitops
    paths:
      - "applications/**/specs/*.yaml"
      - "devops/agent/**"
      - "devops/policy/**"
      - "scripts/**"
      - ".github/workflows/gitops-workflow.yml"

jobs:
  resolve:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: [self-hosted, macOS]
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      spec_file: ${{ steps.resolve.outputs.spec_file }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      app_dir: ${{ steps.resolve.outputs.app_dir }}
      app_path: ${{ steps.resolve.outputs.app_path }}
      app_src_dir: ${{ steps.resolve.outputs.app_src_dir }}
      app_dockerfile: ${{ steps.resolve.outputs.app_dockerfile }}
      manifest_dir: ${{ steps.resolve.outputs.manifest_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FINE_GRAINED_PAT }}
          clean: true
          set-safe-directory: false

      - name: Resolve spec and release id
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          echo "should_run=false" >> "$GITHUB_OUTPUT"

          SPEC_FILE="${{ github.event.inputs.spec_file }}"
          if [ -z "${SPEC_FILE}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              SPEC_FILE="applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
            elif [ "${{ github.event_name }}" = "push" ]; then
              NULL_SHA="0000000000000000000000000000000000000000"
              BEFORE_SHA="${{ github.event.before }}"

              if [ "${BEFORE_SHA}" = "${NULL_SHA}" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                echo "before SHA is null or unavailable; using fallback diff strategy"

                if git show-ref --verify --quiet "refs/remotes/origin/dev"; then
                  BASE_SHA="$(git merge-base "origin/dev" "${{ github.sha }}")"
                  echo "Using merge-base with origin/dev: ${BASE_SHA}"
                  CHANGED_SPECS="$(git diff --name-only "${BASE_SHA}" "${{ github.sha }}" -- 'applications/**/specs/*.yaml')"
                else
                  echo "origin/dev not available; diffing current commit against root"
                  CHANGED_SPECS="$(git diff-tree --root --no-commit-id --name-only -r "${{ github.sha }}" -- 'applications/**/specs/*.yaml')"
                fi
              else
                CHANGED_SPECS="$(git diff --name-only "${BEFORE_SHA}" "${{ github.sha }}" -- 'applications/**/specs/*.yaml')"
              fi
            else
              CHANGED_SPECS="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'applications/**/specs/*.yaml')"
            fi
          fi

          if [ -z "${SPEC_FILE}" ]; then
            CHANGED_COUNT=$(printf '%s\n' "${CHANGED_SPECS}" | sed '/^$/d' | wc -l | tr -d ' ')

            if [ "${CHANGED_COUNT}" -eq 0 ]; then
              echo "No changed spec file detected, skipping pipeline"
              exit 0
            fi

            if [ "${CHANGED_COUNT}" -ne 1 ]; then
              printf 'Expected exactly one changed spec file, got %s:\n' "${CHANGED_COUNT}"
              printf '%s\n' "${CHANGED_SPECS}"
              exit 1
            fi

            SPEC_FILE="$(printf '%s\n' "${CHANGED_SPECS}" | sed '/^$/d' | head -n 1)"
          fi

          APP_DIR=$(python3 -c "from pathlib import Path; print(Path('${SPEC_FILE}').parents[1].name)")
          APP_PATH="applications/${APP_DIR}"
          APP_SRC_DIR="${APP_PATH}/src"
          APP_DOCKERFILE="${APP_PATH}/Dockerfile"
          MANIFEST_DIR="devops/k8s/${APP_DIR}"
          RELEASE_ID=$(python3 -c "import yaml, pathlib; s=yaml.safe_load(pathlib.Path('${SPEC_FILE}').read_text(encoding='utf-8')); print(s['change_id'])")

          if [ ! -f "${SPEC_FILE}" ]; then
            echo "Spec file not found: ${SPEC_FILE}"
            exit 1
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_src_dir=$APP_SRC_DIR" >> "$GITHUB_OUTPUT"
          echo "app_dockerfile=$APP_DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=$MANIFEST_DIR" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "## Resolve"
            echo ""
            echo "- Should run: \`${{ steps.resolve.outputs.should_run }}\`"
            if [ "${{ steps.resolve.outputs.should_run }}" != "true" ]; then
              echo "- No matching spec change detected; downstream jobs will be skipped."
              exit 0
            fi
            echo "- Spec: \`${{ steps.resolve.outputs.spec_file }}\`"
            echo "- Release: \`${{ steps.resolve.outputs.release_id }}\`"
            echo "- Application: \`${{ steps.resolve.outputs.app_path }}\`"
            echo "- GitOps: \`${{ steps.resolve.outputs.manifest_dir }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

