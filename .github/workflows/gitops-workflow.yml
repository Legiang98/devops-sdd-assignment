name: GitOps Pipeline

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: "Spec file path"
        required: false
        default: "applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
  push:
    branches:
      - dev
      - feat/gitops
    paths:
      - "applications/**/specs/*.yaml"
      - ".github/workflows/gitops-workflow.yml"

jobs:
  gitops:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FINE_GRAINED_PAT }}
          set-safe-directory: false

      - name: Resolve Application Metadata
        id: resolve
        run: |
          python3 scripts/resolve_pipeline_spec.py \
            --event "${{ github.event_name }}" \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --manual-spec "${{ github.event.inputs.spec_file }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build image and update GitOps
        if: steps.resolve.outputs.should_run == 'true'
        id: image_meta
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${{ steps.resolve.outputs.app_dir }}"
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "[GitOps] Building image '${IMAGE_REPOSITORY}:${IMAGE_TAG}' via Minikube..."
          minikube image build \
            -f "${{ steps.resolve.outputs.app_dockerfile }}" \
            -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

          echo "[GitOps] Updating manifest..."
          ./scripts/update_image_tag.sh "${{ steps.resolve.outputs.manifest_dir }}" "${IMAGE_REPOSITORY}" "${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit and Push Manifest Changes
        if: steps.resolve.outputs.should_run == 'true'
        env:
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.resolve.outputs.manifest_dir }}"
          
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "ci(gitops): update image tag for ${{ steps.resolve.outputs.release_id }} [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"
