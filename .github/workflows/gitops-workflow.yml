name: GitOps Pipeline

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: "Spec file path"
        required: false
        default: "applications/expense-workflow-service/specs/EXPENSE-finance-approval.yaml"
  push:
    branches:
      - dev
      - feat/gitops
    paths:
      - "applications/**/specs/*.yaml"
      - ".github/workflows/gitops-workflow.yml"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: [self-hosted, macOS]
    outputs:
      should_run: ${{ steps.detect.outputs.changed }}
      app_name: ${{ steps.detect.outputs.app_name }}
      detected_spec: ${{ steps.detect.outputs.detected_spec }}
      manifest_dir: ${{ steps.detect.outputs.manifest_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: false

      - name: Detect Spec Changes
        id: detect
        run: |
          set -euo pipefail
          SPEC_FILE="${{ github.event.inputs.spec_file }}"
          if [ -z "$SPEC_FILE" ]; then
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
               CHANGED_SPEC=$(git diff --name-only origin/dev HEAD -- 'applications/**/specs/*.yaml' | head -n 1)
            else
               CHANGED_SPEC=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'applications/**/specs/*.yaml' | head -n 1)
            fi
            SPEC_FILE="$CHANGED_SPEC"
          fi
          
          if [ -z "$SPEC_FILE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          APP_NAME=$(basename $(dirname $(dirname "$SPEC_FILE")))
          echo "detected_spec=$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=devops/k8s/$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build App Image via Minikube
        if: steps.detect.outputs.changed == 'true'
        run: |
          APP_NAME="${{ steps.detect.outputs.app_name }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          minikube image build -t "$APP_NAME:$IMAGE_TAG" .

  gitops:
    needs: build
    if: needs.build.outputs.should_run == 'true'
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FINE_GRAINED_PAT }}
          set-safe-directory: false

      - name: Setup Python and Dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install requests pyyaml

      - name: Generate Infrastructure Manifests
        run: |
          source .venv/bin/activate
          python3 devops/agent/generate_gitops.py \
            --spec "${{ needs.build.outputs.detected_spec }}" \
            --output-dir "${{ needs.build.outputs.manifest_dir }}"

      - name: Run OPA Policy Check
        run: |
          echo "[OPA] Checking manifests for ${{ needs.build.outputs.app_name }}..."
          if grep -r "privileged: true" "${{ needs.build.outputs.manifest_dir }}"; then
            echo "❌ Policy violation: Privileged containers are not allowed!"
            exit 1
          fi
          echo "✅ OPA policy check passed."

      - name: Update Image Tag and Push Proposal
        id: push_proposal
        env:
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          set -euo pipefail
          APP_NAME="${{ needs.build.outputs.app_name }}"
          MANIFEST_DIR="${{ needs.build.outputs.manifest_dir }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          PROP_BRANCH="proposal/${APP_NAME}-${GITHUB_SHA::8}"

          ./scripts/update_image_tag.sh "$MANIFEST_DIR" "$APP_NAME" "$IMAGE_TAG"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_DIR"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "prop_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "ci(gitops): propose manifest update for $APP_NAME"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:$PROP_BRANCH"
          echo "prop_branch=$PROP_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create Approval Issue
        if: steps.push_proposal.outputs.prop_branch != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const app = "${{ needs.build.outputs.app_name }}";
            const branch = "${{ steps.push_proposal.outputs.prop_branch }}";
            const diff = require('child_process').execSync('git diff origin/${{ github.ref_name }} HEAD -- devops/k8s/').toString();
            
            await github.rest.issues.create({
              owner,
              repo,
              title: `[GitOps Approval Required] manifest update for ${app}`,
              labels: ['gitops-approval'],
              body: `### 🚀 Manifest Update Request\n\nApplication: **${app}**\nProposal Branch: \`${branch}\`\nTarget Branch: \`${{ github.ref_name }}\`\n\n#### Diff Evidence:\n\`\`\`diff\n${diff}\n\`\`\`\n\nPlease review and comment \`/approve\` to merge these changes.`
            });
