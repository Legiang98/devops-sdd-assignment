  build_and_gitops:
    runs-on: [self-hosted, macOS]
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true'
    outputs:
      image_repository: ${{ steps.image_meta.outputs.image_repository }}
      image_tag: ${{ steps.image_meta.outputs.image_tag }}
      has_changes: ${{ steps.generated_changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FINE_GRAINED_PAT }}
          clean: true
          set-safe-directory: false

      - name: Download generated workspace
        uses: actions/download-artifact@v4
        with:
          name: generated-workspace-${{ needs.resolve.outputs.release_id }}
          path: .

      - name: Build app (syntax/build smoke check)
        run: |
          python3 -m compileall "${{ needs.resolve.outputs.app_src_dir }}"

      - name: Build image and update GitOps image tag
        id: image_meta
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${{ needs.resolve.outputs.app_dir }}"
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "[GitOps] Verifying Minikube environment..."
          if ! command -v minikube >/dev/null 2>&1; then
            echo "::error::minikube CLI not found on runner"
            exit 1
          fi

          if ! minikube status >/dev/null 2>&1; then
            echo "::error::minikube is not running. Please start it with 'minikube start'."
            exit 1
          fi

          echo "[GitOps] Building image '${IMAGE_REPOSITORY}:${IMAGE_TAG}' via Minikube..."
          minikube image build \
            -f "${{ needs.resolve.outputs.app_dockerfile }}" \
            -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

          echo "[GitOps] Updating manifest in ${{ needs.resolve.outputs.manifest_dir }}..."
          ./scripts/update_image_tag.sh "${{ needs.resolve.outputs.manifest_dir }}" "${IMAGE_REPOSITORY}" "${IMAGE_TAG}"

          echo "[GitOps] Verifying updated manifest content:"
          grep "image:" "${{ needs.resolve.outputs.manifest_dir }}/deployment.yaml"

          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect generated artifacts changes
        id: generated_changes
        run: |
          set -euo pipefail
          if git status --porcelain -- "${{ needs.resolve.outputs.app_path }}/specs" "${{ needs.resolve.outputs.app_path }}/src" "${{ needs.resolve.outputs.app_path }}/tests" "${{ needs.resolve.outputs.app_path }}/Dockerfile" "${{ needs.resolve.outputs.manifest_dir }}" | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary
        run: |
          {
            echo "## Build And GitOps"
            echo ""
            echo "- Image: \`${{ steps.image_meta.outputs.image_repository }}:${{ steps.image_meta.outputs.image_tag }}\`"
            echo "- Changed paths staged scope: \`${{ needs.resolve.outputs.app_path }}\`, \`${{ needs.resolve.outputs.manifest_dir }}\`"
            echo "- Has changes: \`${{ steps.generated_changes.outputs.has_changes }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final workspace
        uses: actions/upload-artifact@v4
        with:
          name: final-workspace-${{ needs.resolve.outputs.release_id }}
          path: |
            build/releases/${{ needs.resolve.outputs.release_id }}/
            logs/pipeline.log
            ${{ needs.resolve.outputs.app_path }}/
            ${{ needs.resolve.outputs.manifest_dir }}/

  publish:
    runs-on: [self-hosted, macOS]
    needs: [resolve, build_and_gitops]
    if: needs.resolve.outputs.should_run == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FINE_GRAINED_PAT }}
          clean: true
          set-safe-directory: false

      - name: Download final workspace
        uses: actions/download-artifact@v4
        with:
          name: final-workspace-${{ needs.resolve.outputs.release_id }}
          path: .

      - name: Auto-commit generated artifacts
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'feat/gitops') && needs.build_and_gitops.outputs.has_changes == 'true'
        env:
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            "${{ needs.resolve.outputs.app_path }}/specs" \
            "${{ needs.resolve.outputs.app_path }}/src" \
            "${{ needs.resolve.outputs.app_path }}/tests" \
            "${{ needs.resolve.outputs.app_path }}/Dockerfile" \
            "${{ needs.resolve.outputs.manifest_dir }}"; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          git commit -m "ci(spec): generate code for ${{ needs.resolve.outputs.release_id }} [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Write summary
        run: |
          {
            echo "## Publish"
            echo ""
            echo "- Has changes: \`${{ needs.build_and_gitops.outputs.has_changes }}\`"
            echo "- Image: \`${{ needs.build_and_gitops.outputs.image_repository }}:${{ needs.build_and_gitops.outputs.image_tag }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-driven-evidence-${{ github.run_id }}
          path: |
            logs/pipeline.log
            build/releases/${{ needs.resolve.outputs.release_id }}/evidence/
            ${{ needs.resolve.outputs.app_src_dir }}/generated/spec_contract.py
            ${{ needs.resolve.outputs.app_src_dir }}/main.py
            ${{ needs.resolve.outputs.manifest_dir }}/
