name: Feat Branch Workflow

on:
  push:
    branches:
      - "feat/*"

permissions:
  contents: write
  pull-requests: write

jobs:
  feat-pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip feat workflow]') }}
    runs-on: [self-hosted, macOS]
    env:
      AGENT_CODEGEN_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_TIMEOUT_SECONDS: 180
      FEAT_PR_BASE_BRANCH: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Spec Scan
        id: scan
        run: |
          set -euo pipefail
          SCAN_JSON="$(python3 scripts/feat_branch_scan.py --base-ref origin/${FEAT_PR_BASE_BRANCH})"
          echo "spec_file=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"spec_file\"])' "${SCAN_JSON}")" >> "$GITHUB_OUTPUT"
          echo "release_id=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"release_id\"])' "${SCAN_JSON}")" >> "$GITHUB_OUTPUT"
          echo "app_path=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"app_path\"])' "${SCAN_JSON}")" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"manifest_path\"])' "${SCAN_JSON}")" >> "$GITHUB_OUTPUT"

      - name: Validate Spec Via Deterministic Provider
        run: |
          . .venv/bin/activate
          python3 devops/policy/validate_spec.py \
            --spec "${{ steps.scan.outputs.spec_file }}"

      - name: Generate Code and Artifacts
        run: |
          . .venv/bin/activate
          ./scripts/generate.sh \
            "${{ steps.scan.outputs.spec_file }}" \
            "${AGENT_CODEGEN_PROVIDER}" \
            "${OLLAMA_MODEL}" \
            "${OLLAMA_BASE_URL}" \
            "${OLLAMA_TIMEOUT_SECONDS}"

      - name: Commit Generated Changes To Current Feat Branch
        id: commit_generated
        env:
          RELEASE_ID: ${{ steps.scan.outputs.release_id }}
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.scan.outputs.app_path }}"
          git add "${{ steps.scan.outputs.manifest_path }}"

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "feat: generate ${RELEASE_ID} [skip feat workflow]"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create or Reuse Pull Request
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ env.FEAT_PR_BASE_BRANCH }}
          BRANCH_NAME: ${{ github.ref_name }}
          HAS_CHANGES: ${{ steps.commit_generated.outputs.has_changes }}
          RELEASE_ID: ${{ steps.scan.outputs.release_id }}
          SPEC_FILE: ${{ steps.scan.outputs.spec_file }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.BRANCH_NAME;
            const base = process.env.BASE_BRANCH;
            const title = `feat: ${process.env.RELEASE_ID}`;
            const body = [
              "Spec-driven feat branch workflow PR.",
              "",
              `- Release ID: \`${process.env.RELEASE_ID}\``,
              `- Spec: \`${process.env.SPEC_FILE}\``,
              `- Generated changes committed to branch: \`${head}\``,
              `- Workflow committed new changes: \`${process.env.HAS_CHANGES || "false"}\``,
              "- This workflow validates specs and generates code automatically.",
              "- Deployment and rollback are intentionally excluded.",
            ].join("\n");

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
            });

            core.info(`Created PR: ${created.data.html_url}`);
