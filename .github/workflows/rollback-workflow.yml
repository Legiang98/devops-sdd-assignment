name: Rollback Workflow

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose_rollback_plan:
    name: Propose Rollback Plan
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'rollback-needed')
    runs-on: ubuntu-latest
    steps:
      - name: Post Plan to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- rollback-context\s*([\s\S]*?)-->/);
            if (!match) {
              core.setFailed('Missing rollback context in issue body.');
              return;
            }
            const rollbackContext = JSON.parse(match[1].trim());
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### 🛡️ Proposed Rollback Plan',
                '',
                `- Service: \`${rollbackContext.service_name}\``,
                `- Current image: \`${rollbackContext.current_version}\``,
                `- Rollback target: \`${rollbackContext.previous_healthy_version}\``,
                `- Source of healthy target: \`${rollbackContext.previous_healthy_source}\``,
                '',
                'Please comment `/approve-rollback` to proceed.'
              ].join('\n')
            })

  execute_rollback:
    name: Execute Approved Rollback
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'rollback-needed') &&
      contains(github.event.comment.body, '/approve-rollback') &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}
          fetch-depth: 0
          set-safe-directory: false

      - name: Parse Rollback Context
        id: rollback_context
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- rollback-context\s*([\s\S]*?)-->/);
            if (!match) {
              core.setFailed('Missing rollback context in issue body.');
              return;
            }
            const rollbackContext = JSON.parse(match[1].trim());
            if (!rollbackContext.previous_healthy_tag || !rollbackContext.image_repository) {
              core.setFailed('Rollback context is missing healthy image metadata.');
              return;
            }
            core.setOutput('app_name', rollbackContext.app_name);
            core.setOutput('service_name', rollbackContext.service_name);
            core.setOutput('manifest_dir', rollbackContext.manifest_dir);
            core.setOutput('state_path', rollbackContext.state_path);
            core.setOutput('image_repository', rollbackContext.image_repository);
            core.setOutput('current_version', rollbackContext.current_version);
            core.setOutput('target_version', rollbackContext.previous_healthy_version);
            core.setOutput('target_tag', rollbackContext.previous_healthy_tag);
            core.setOutput('change_id', rollbackContext.change_id);
            core.setOutput('git_ref_name', rollbackContext.git_ref_name);

      - name: Update GitOps Manifest
        run: |
          ./scripts/update_image_tag.sh \
            "${{ steps.rollback_context.outputs.manifest_dir }}" \
            "${{ steps.rollback_context.outputs.image_repository }}" \
            "${{ steps.rollback_context.outputs.target_tag }}"

      - name: Promote Healthy State After Rollback
        run: |
          python3 devops/observability/evaluation/resolve_deployment_state.py promote \
            --app "${{ steps.rollback_context.outputs.app_name }}" \
            --change-id "rollback-${{ github.event.issue.number }}-${{ steps.rollback_context.outputs.change_id }}" \
            --git-sha "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --source "rollback"

      - name: Commit and Push Rollback
        env:
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.rollback_context.outputs.manifest_dir }}" "devops/state/${{ steps.rollback_context.outputs.app_name }}.json"
          if git diff --cached --quiet; then
            echo "No rollback changes to commit"
            exit 0
          fi
          git commit -m "fix(rollback): revert ${{ steps.rollback_context.outputs.app_name }} to ${{ steps.rollback_context.outputs.target_tag }} [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ steps.rollback_context.outputs.git_ref_name }}"

      - name: Verify ArgoCD Sync and Health
        run: |
          echo "Waiting for ArgoCD sync..."
          echo "Verifying service health..."
          # logic to poll k8s health or argo status

      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '✅ Rollback executed successfully.',
                '',
                '- Service: `${{ steps.rollback_context.outputs.service_name }}`',
                '- Previous image: `${{ steps.rollback_context.outputs.current_version }}`',
                '- Current image: `${{ steps.rollback_context.outputs.target_version }}`'
              ].join('\n')
            })
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
