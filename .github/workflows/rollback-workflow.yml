name: Rollback Workflow

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rollback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan_rollback:
    name: Plan Rollback Diff
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'rollback-needed')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/plan-rollback'))
    runs-on: [self-hosted, macOS]
    outputs:
      rollback_context: ${{ steps.parse.outputs.rollback_context }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Context
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- rollback-context\s*([\s\S]*?)\s*-->/);
            if (!match) throw new Error('Missing rollback context');
            const ctx = JSON.parse(match[1]);
            core.setOutput('rollback_context', JSON.stringify(ctx));

      - name: Generate Diff
        id: diff
        env:
          ROLLBACK_CONTEXT: ${{ steps.parse.outputs.rollback_context }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, subprocess
          ctx = json.loads(os.environ["ROLLBACK_CONTEXT"])
          
          # Apply changes locally to see diff
          subprocess.run(["./scripts/update_image_tag.sh", ctx["manifest_dir"], ctx["image_repository"], ctx["previous_healthy_tag"]], check=True)
          
          # Get diff
          diff = subprocess.check_output(["git", "diff", ctx["manifest_dir"]], text=True)
          with open("rollback.diff", "w") as f:
              f.write(diff)
          EOF

      - name: Post Diff Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('rollback.diff', 'utf8');
            const ctx = JSON.parse('${{ steps.parse.outputs.rollback_context }}');
            
            const body = [
              '### 🔍 Rollback Plan (Preview)',
              'I have calculated the changes required to revert to the last known healthy state.',
              '',
              '```diff',
              diff || 'No changes detected (already at target version).',
              '```',
              '',
              `**Target Tag:** \`${ctx.previous_healthy_tag}\``,
              '',
              'Reply with `/approve-rollback` or `/lgtm` to execute this revert.'
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: body
            });

  resolve_context:
    name: Resolve Rollback Context
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body, '/approve-rollback') || contains(github.event.comment.body, '/lgtm'))
    runs-on: ubuntu-latest
    outputs:
      rollback_context: ${{ steps.parse.outputs.rollback_context }}
      service_name: ${{ steps.parse.outputs.service_name }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - name: Parse Approval Comment And Issue Context
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            const core = require('@actions/core');
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name);
            const association = comment.author_association || 'NONE';
            const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            if (!allowed.has(association)) {
              core.setFailed(`Comment author association ${association} is not allowed to approve rollback.`);
              return;
            }

            if (!labels.includes('rollback-needed')) {
              core.setFailed('Issue is not labeled rollback-needed.');
              return;
            }

            const body = issue.body || '';
            const match = body.match(/<!-- rollback-context\s*([\s\S]*?)\s*-->/);
            if (!match) {
              core.setFailed('Rollback context block is missing from issue body.');
              return;
            }

            let rollbackContext;
            try {
              rollbackContext = JSON.parse(match[1]);
            } catch (error) {
              core.setFailed(`Rollback context JSON is invalid: ${error.message}`);
              return;
            }

            core.setOutput('rollback_context', JSON.stringify(rollbackContext));
            core.setOutput('service_name', rollbackContext.service_name);
            core.setOutput('issue_number', String(issue.number));

      - name: Add Approval Acknowledgement
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.parse.outputs.issue_number }}'),
              body: [
                'Rollback approval acknowledged.',
                '',
                `- Approved by: @${context.payload.comment.user.login}`,
                `- Service: \`${{ steps.parse.outputs.service_name }}\``,
                '- Executing deterministic GitOps revert now.'
              ].join('\n')
            });

  execute_rollback:
    name: Execute Rollback
    needs: resolve_context
    runs-on: [self-hosted, macOS]
    outputs:
      commit_sha: ${{ steps.rollback.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}
          fetch-depth: 0
          set-safe-directory: false

      - name: Apply And Push Rollback
        id: rollback
        env:
          ROLLBACK_CONTEXT: ${{ needs.resolve_context.outputs.rollback_context }}
          GH_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import sys

          ctx = json.loads(os.environ["ROLLBACK_CONTEXT"])

          subprocess.run(
              [
                  "./scripts/update_image_tag.sh",
                  ctx["manifest_dir"],
                  ctx["image_repository"],
                  ctx["previous_healthy_tag"],
              ],
              check=True,
          )

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", ctx["manifest_dir"]], check=True)

          diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if diff.returncode == 0:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("commit_sha=\n")
              sys.exit(0)

          msg = f"fix(rollback): revert {ctx['app_name']} to {ctx['previous_healthy_tag']} [skip ci]"
          subprocess.run(["git", "commit", "-m", msg], check=True)

          commit_sha = (
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          )
          remote_url = (
              f"https://x-access-token:{os.environ['GH_PAT']}@github.com/"
              f"{os.environ['GITHUB_REPOSITORY']}.git"
          )
          subprocess.run(["git", "remote", "set-url", "origin", remote_url], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:dev"], check=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"commit_sha={commit_sha}\n")
          EOF

      - name: Comment Rollback Commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            const commitSha = '${{ steps.rollback.outputs.commit_sha }}';
            const lines = [
              'GitOps rollback update applied.',
              '',
              `- Service: \`${{ needs.resolve_context.outputs.service_name }}\``,
            ];
            if (commitSha) {
              lines.push(`- Commit: \`${commitSha}\``);
            } else {
              lines.push('- Commit: no-op, manifests already matched the deterministic rollback target.');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.resolve_context.outputs.issue_number }}'),
              body: lines.join('\n')
            });

  verify_rollback:
    name: Verify Rollback
    needs: [resolve_context, execute_rollback]
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: false

      - name: Resolve Verification Context
        id: verify_context
        env:
          ROLLBACK_CONTEXT: ${{ needs.resolve_context.outputs.rollback_context }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path
          import yaml

          ctx = json.loads(os.environ["ROLLBACK_CONTEXT"])
          deployment_path = Path(ctx["manifest_dir"]) / "deployment.yaml"
          deployment = yaml.safe_load(deployment_path.read_text(encoding="utf-8")) or {}

          metadata = deployment.get("metadata") or {}
          spec = deployment.get("spec") or {}
          template = ((spec.get("template") or {}).get("spec") or {})
          containers = template.get("containers") or []
          image = ""
          if containers and isinstance(containers[0], dict):
              image = str(containers[0].get("image") or "")

          namespace = str(metadata.get("namespace") or "default")
          deployment_name = str(metadata.get("name") or ctx["service_name"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"namespace={namespace}\n")
              handle.write(f"deployment_name={deployment_name}\n")
              handle.write(f"expected_image={image}\n")
              handle.write(f"service_name={ctx['service_name']}\n")
              handle.write(f"change_id={ctx['change_id']}\n")
              handle.write(f"current_version={ctx['current_version']}\n")
              handle.write(f"target_version={ctx['previous_healthy_version']}\n")
          EOF

      - name: Wait For Rolled Back Deployment
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          NAMESPACE="${{ steps.verify_context.outputs.namespace }}"
          DEPLOYMENT_NAME="${{ steps.verify_context.outputs.deployment_name }}"
          EXPECTED_IMAGE="${{ steps.verify_context.outputs.expected_image }}"

          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT_NAME" --timeout=300s

          ACTUAL_IMAGE="$(kubectl -n "$NAMESPACE" get deployment "$DEPLOYMENT_NAME" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "Expected image $EXPECTED_IMAGE but found $ACTUAL_IMAGE"
            exit 1
          fi

          kubectl -n "$NAMESPACE" wait --for=condition=available "deployment/$DEPLOYMENT_NAME" --timeout=120s

      - name: Comment Rollback Verification Success
        if: steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.resolve_context.outputs.issue_number }}'),
              body: [
                'Rollback verification passed.',
                '',
                `- Service: \`${{ steps.verify_context.outputs.service_name }}\``,
                `- Target version: \`${{ steps.verify_context.outputs.target_version }}\``,
                `- Deployment: \`${{ steps.verify_context.outputs.deployment_name }}\` in namespace \`${{ steps.verify_context.outputs.namespace }}\``
              ].join('\n')
            });

      - name: Create Rollback Failure Issue
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FINE_GRAINED_PAT || github.token }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [Rollback Failed] ${{ steps.verify_context.outputs.service_name }} - ${{ steps.verify_context.outputs.change_id }}`,
              labels: ['rollback-failed', 'observability-alert'],
              body: [
                '## Rollback Verification Failed',
                '',
                `- Service: \`${{ steps.verify_context.outputs.service_name }}\``,
                `- Change ID: \`${{ steps.verify_context.outputs.change_id }}\``,
                `- Current version before rollback: \`${{ steps.verify_context.outputs.current_version }}\``,
                `- Rollback target: \`${{ steps.verify_context.outputs.target_version }}\``,
                `- Expected deployment image: \`${{ steps.verify_context.outputs.expected_image }}\``,
                `- Namespace: \`${{ steps.verify_context.outputs.namespace }}\``,
                `- Deployment: \`${{ steps.verify_context.outputs.deployment_name }}\``,
                '',
                'Rollback commit was pushed to GitOps, but the cluster did not converge to a healthy rolled-back deployment within the verification window.',
                'Manual investigation is required.',
              ].join('\n')
            });

      - name: Fail Workflow On Verification Error
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Rollback verification failed; issue created for manual investigation."
          exit 1
